<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Finanze personali</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Script solo da questo sito. Connessioni solo verso: accesso Microsoft, Microsoft Graph (OneDrive)
     e i server da cui OneDrive fa scaricare il contenuto dei file (indirizzi temporanei già autorizzati). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.1drv.com https://*.microsoftpersonalcontent.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/icona-64.png">
<link rel="apple-touch-icon" href="icone/icona-256.png">
<link rel="stylesheet" href="css/stile.css">
<link rel="stylesheet" href="css/web.css">
</head>
<body class="chiusa">
<div class="app">
  <nav class="glass" aria-label="Sezioni">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg></div>
      Finanze
    </div>
    <button class="nav-btn on" data-view="movimenti" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Movimenti <span class="badge" id="badge" hidden></span>
    </button>
    <button class="nav-btn" data-view="riepilogo" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16V7"/></svg>
      Riepilogo
    </button>
    <button class="nav-btn" data-view="conti" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Conti
    </button>
    <button class="nav-btn" data-view="regole" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/></svg>
      Regole
    </button>
    <button class="nav-btn" data-view="dati" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      Dati
    </button>
    <div class="spacer"></div>
    <div class="safe" id="safe">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div id="safe-text">Dati cifrati su questo dispositivo</div>
    </div>
    <button class="btn" type="button" id="btn-backup" style="justify-content:center;margin-top:8px;border-radius:12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Backup cifrato
    </button>
    <button class="btn" type="button" id="btn-blocca" style="justify-content:center;margin-top:8px;border-radius:12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Blocca
    </button>
  </nav>
  <main id="main"></main>
</div>

<!-- Porta d'ingresso: sblocco, primo avvio, ripristino -->
<div id="porta" class="porta">
  <div class="porta-box glass" id="porta-box"><div class="note">Caricamento…</div></div>
</div>

<input type="file" id="file-estratto" multiple accept=".xls,.xlsx,.xlsm,.csv,.txt,.htm,.html" hidden>
<input type="file" id="file-porta" hidden>

<div class="modal-bg" id="modal-bg"><div class="modal glass" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/cassaforte.js"></script>
<script src="js/impronta.js"></script>
<script src="js/unione.js"></script>
<script src="js/microsoft.js"></script>
<script src="js/nuvola.js"></script>
<script src="js/ui.js"></script>
<script src="js/porta.js"></script>
</body>
</html>
